# Decap CMS — конфигурация сайта школы № 29
# Документация: https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: ntiwgg/school29-site
  branch: dev
  # Внешний OAuth Decap по умолчанию: без собственного OAuth App и без client_id.
  # Decap сам обращается к своему OAuth-прокси (https://api.netlify.com/auth → GitHub).
  # base_url НЕ указываем: это адрес OAuth-сервера, а не GitHub API —
  # api_root для GitHub уже по умолчанию https://api.github.com.

# Изображения из редактора попадают в site/public/uploads (в git!) и отдаются с /uploads/
# Пути Decap резолвятся от КОРНЯ git-репозитория (сайт живёт в подпапке site/), поэтому все пути имеют префикс site/.
media_folder: site/public/uploads
public_folder: /uploads

collections:
  - name: news
    label: Новости
    label_singular: Новость
    folder: site/src/content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: frontmatter
    summary: "{{date}} — {{title}}"
    fields:
      - { name: title, label: Заголовок, widget: string }
      - { name: date, label: Дата, widget: datetime, format: YYYY-MM-DD, hint: "Новость с датой в будущем не показывается на сайте до наступления даты (планирование публикации)" }
      - name: tag
        label: Рубрика
        widget: select
        options: [События, Достижения, Объявления, Приём, Спорт, Безопасность]
      - name: cover
        label: Иконка
        widget: select
        options: [megaphone, graduation, award, sun, clock, train, flask, diploma, shield]
      - { name: excerpt, label: Анонс (текст карточки), widget: text, required: false }
      - { name: body, label: Текст новости, widget: markdown }

  - name: announcements
    label: Объявления
    label_singular: Объявление
    folder: site/src/content/announcements
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: frontmatter
    summary: "{{date}} — {{title}}"
    fields:
      - { name: title, label: Заголовок, widget: string }
      - { name: date, label: Дата, widget: datetime, format: YYYY-MM-DD, hint: "Объявление с датой в будущем не показывается на сайте до наступления даты (планирование публикации)" }
      - { name: important, label: "Важное (показывать с маркером)", widget: boolean, default: false }
      - name: icon
        label: Иконка
        widget: select
        options: [alert, calendar, book, utensils]
      - { name: excerpt, label: "Текст объявления (на главной)", widget: text, required: false }
      - { name: body, label: "Полный текст", widget: markdown, required: false }
