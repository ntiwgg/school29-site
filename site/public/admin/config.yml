# Decap CMS — конфигурация сайта школы № 29
# Документация: https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: ntiwgg/school29-site
  branch: dev
  # Внешний OAuth Decap по умолчанию: без собственного OAuth App и без client_id.
  # Decap сам обращается к своему OAuth-прокси (https://api.netlify.com/auth → GitHub).
  # base_url НЕ указываем: это адрес OAuth-сервера, а не GitHub API —
  # api_root для GitHub уже по умолчанию https://api.github.com.

# Изображения из редактора попадают в site/public/uploads (в git!) и отдаются с /uploads/
# Пути Decap резолвятся от КОРНЯ git-репозитория (сайт живёт в подпапке site/), поэтому все пути имеют префикс site/.

# ВНИМАНИЕ: Decap не транслитерирует слаги — имена файлов будут кириллическими (URL с кириллицей).
# Правило для редактора: для новостей/объявлений вводить заголовок с латинским словом
# или мириться с кириллическими URL. Транслитерация в Decap невозможна (см. docs/tech-debt.md).
media_folder: site/public/uploads
public_folder: /uploads

collections:
  - name: news
    label: Новости
    label_singular: Новость
    folder: site/src/content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: frontmatter
    summary: "{{date}} — {{title}}"
    fields:
      - { name: title, label: Заголовок, widget: string }
      - { name: date, label: Дата, widget: datetime, format: YYYY-MM-DD, hint: "Новость с датой в будущем не показывается на сайте до наступления даты (планирование публикации)" }
      - name: tag
        label: Рубрика
        widget: select
        options: [События, Достижения, Объявления, Приём, Спорт, Безопасность]
      - name: cover
        label: Иконка
        widget: select
        options: [megaphone, graduation, award, sun, clock, train, flask, diploma, shield]
      - { name: excerpt, label: Анонс (текст карточки), widget: text, required: false }
      - { name: body, label: Текст новости, widget: markdown }

  - name: announcements
    label: Объявления
    label_singular: Объявление
    folder: site/src/content/announcements
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: frontmatter
    summary: "{{date}} — {{title}}"
    fields:
      - { name: title, label: Заголовок, widget: string }
      - { name: date, label: Дата, widget: datetime, format: YYYY-MM-DD, hint: "Объявление с датой в будущем не показывается на сайте до наступления даты (планирование публикации)" }
      - { name: important, label: "Важное (показывать с маркером)", widget: boolean, default: false }
      - name: icon
        label: Иконка
        widget: select
        options: [alert, calendar, book, utensils]
      - { name: excerpt, label: "Текст объявления (на главной)", widget: text, required: false }
      - { name: body, label: "Полный текст", widget: markdown, required: false }

  - name: sveden
    label: Сведения об образовательной организации
    label_singular: Подраздел сведений
    folder: site/src/content/sveden
    create: true
    slug: "{{slug}}"
    format: frontmatter
    summary: "{{num}} — {{title}}"
    fields:
      - { name: num, label: "№ подраздела", widget: number, value_type: int, hint: "Порядок подразделов по приказу Рособрнадзора № 1493 (1–14)" }
      - { name: title, label: Название, widget: string }
      - { name: description, label: "Краткое описание (карточка на /sveden/)", widget: text }
      - { name: body, label: "Содержание подраздела", widget: markdown }

  - name: teachers
    label: Педагогический состав
    label_singular: Педагог
    folder: site/src/content/teachers
    create: true
    slug: "{{slug}}"
    format: frontmatter
    summary: "{{name}} — {{position}}"
    fields:
      - { name: order, label: "Порядок в таблице", widget: number, value_type: int, hint: "Чем меньше число, тем выше строка (1 — первая)" }
      - { name: name, label: ФИО, widget: string }
      - { name: position, label: Должность, widget: string }
      - { name: subjects, label: "Преподаваемые учебные предметы", widget: string }
      - { name: category, label: "Квалификационная категория", widget: string, required: false }
      - { name: education, label: "Образование и квалификация", widget: string, required: false }
      - { name: degree, label: "Учёная степень / звание", widget: string, required: false, hint: "Оставьте пустым, если нет" }
      - name: profdev
        label: "Повышение квалификации за 3 года"
        widget: list
        required: false
        hint: "Каждая строка — один курс"
        field: { label: Курс, name: item, widget: string }
      - name: retraining
        label: "Профессиональная переподготовка"
        widget: list
        required: false
        hint: "Каждая строка — одна программа"
        field: { label: Программа, name: item, widget: string }
      - { name: experience, label: "Общий стаж / стаж по специальности", widget: string, required: false }
      - { name: programs, label: "Наименование реализуемых программ", widget: string, required: false }

  - name: documents
    label: Документы
    label_singular: Документ
    folder: site/src/content/documents
    create: true
    slug: "{{slug}}"
    format: frontmatter
    summary: "{{doc-type}} — {{title}}"
    fields:
      - { name: title, label: "Название документа", widget: string }
      - name: doc-type
        label: "Тип документа"
        widget: select
        options: [Устав, ЛНА, Приказ, Отчёт, Договор, Иное]
      - { name: date, label: "Дата документа", widget: date, format: YYYY-MM-DD, required: false, hint: "Оставьте пустым, если дата не определена" }
      - { name: file, label: "Файл", widget: file, required: false, hint: "Файл из медиабиблиотеки (загружается в /uploads). Пока файла нет — поле пустое" }
      - { name: description, label: "Краткое описание", widget: text, required: false }
      - { name: body, label: "Аннотация / примечание", widget: markdown, required: false }

  - name: contacts
    label: Контакты
    files:
      - name: contacts
        label: Контакты
        file: site/src/content/contacts.md
        format: frontmatter
        fields:
          - { name: address, label: "Адрес", widget: string }
          - name: phones
            label: "Телефоны"
            widget: list
            required: false
            hint: "Каждая строка в формате «Метка: номер», например «Приёмная: +7 (8142) 78-00-29»"
            field: { label: Телефон, name: item, widget: string }
          - { name: email, label: "Электронная почта", widget: string }
          - { name: workhours, label: "Режим работы", widget: string }
          - name: requisites
            label: "Реквизиты"
            widget: list
            required: false
            hint: "Каждая строка в формате «Метка: значение», например «ИНН / КПП: 1001000000 / 100101001»"
            field: { label: Реквизит, name: item, widget: string }
